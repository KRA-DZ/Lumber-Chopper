<text x="56" y="881" font-size="15">Пунктир: будущая река и ручьи. Золотые отметки: кандидаты переходов.</text>
<text x="56" y="908" font-size="13">Первым строим только ручей у лагеря → западное озеро, с доступным бродом.</text>
<text x="56" y="934" font-size="13">Плотина, уровни воды, пути рабочих и подходы к зданиям сохраняются.</text>
<text x="56" y="960" font-size="13">Малые пруды: кандидаты; рыбалка сначала у существующего большого озера.</text>
<text x="56" y="990" font-size="13">Перед реализацией: проверить коллизии, широкие проходы и согласовать берега.</text>
