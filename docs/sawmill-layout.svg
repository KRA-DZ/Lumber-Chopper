</g>
<text x="64" y="1194" font-size="21">1. Упавшие балки: 6 HP → 3 бревна.     2. Тяжёлый завал: 24 HP → 6 брёвен.</text>
<text x="64" y="1234" font-size="20">Зелёный пунктир: доступные обходы. Оранжевый: расчищаемые короткие пути.</text>
<text x="64" y="1274" font-size="18">Награды одноразовые. Полный рюкзак не мешает расчистке — остаток древесины ждёт на земле.</text>
<text x="64" y="1320" font-size="18">3. Распоряжение последней смене</text>
<text x="714" y="1320" font-size="18">4. Ведомость пустых телег</text>
<text x="64" y="1350" font-size="18">5. Памятка остановленного станка</text>
<text x="714" y="1350" font-size="18">6. Невывезенная партия</text>
<text x="64" y="1380" font-size="18">7. Ящик с перечёркнутыми именами</text>
<text x="714" y="1380" font-size="18">8. Ручной привод станка</text>
<text x="64" y="1410" font-size="18">9. Ниша седьмой смены</text>
</g></svg>
