<text x="64" y="1310" font-size="16">Пунктир: решётка и тайный вход. Подсказка к тайнику — в записке «Последний дозор».</text>
<text x="64" y="1333" font-size="16">Жетон — личная находка для дневника. Сундуки по-прежнему требуют покупные ключи.</text>
